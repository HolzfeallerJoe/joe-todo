appId: dev.joe.joe_todo
name: Einkaufsliste im eigenen Reiter
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Einkaufsliste"
    direction: DOWN
    centerElement: true
# retryTapIfNoChange aus: sonst tippt Maestro nach dem Seitenwechsel ein
# zweites Mal auf dieselbe Stelle.
- tapOn:
    text: "Einkaufsliste"
    retryTapIfNoChange: false
- assertVisible: "(?s).*Noch nichts auf der Liste.*"
# Eingabefeld unten; nach Enter bleibt der Fokus darin, der zweite Eintrag
# geht also ohne erneutes Antippen. Hinweis: inputText kann nur ASCII.
- tapOn: "Was fehlt?"
- inputText: "Milch"
- pressKey: Enter
- inputText: "Brot"
- pressKey: Enter
- hideKeyboard
- assertVisible: "Milch"
- assertVisible: "Brot"
# Abhaken per Tipp: Milch rutscht unter Brot.
- tapOn: "Milch"
# Loeschen per langem Druck, mit Rueckfrage.
- longPressOn: "Brot"
- tapOn: "Löschen"
- assertVisible: "Eintrag löschen?"
- tapOn: "Löschen"
- assertNotVisible: "Brot"
- assertVisible: "Milch"
- takeScreenshot: shots/10_shopping
# Zweite Liste: wird gleich gezeigt, die Eintraege bleiben getrennt.
- tapOn: "Neue Liste"
- inputText: "Baumarkt"
- tapOn: "Speichern"
- assertVisible: "(?s).*Noch nichts auf der Liste.*"
- assertNotVisible: "Milch"
- tapOn: "Was fehlt?"
- inputText: "Schrauben"
- pressKey: Enter
- hideKeyboard
- assertVisible: "Schrauben"
# Teilen fragt erst: als Text oder gemeinsam bearbeiten. Als Text oeffnet
# das Teilen-Blatt des Systems mit dem Text der Liste.
- tapOn: "Liste teilen"
- assertVisible: "(?s)Gemeinsam bearbeiten.*"
- tapOn: "(?s)Als Text senden.*"
- assertVisible: "(?s).*Schrauben.*"
- takeScreenshot: shots/10_shopping_teilen
- back
# Zurueck zur ersten Liste. "Einkaufsliste" steht auch im Titel, der Chip
# ist der zweite Treffer.
- tapOn:
    text: "Einkaufsliste"
    index: 1
- assertVisible: "Milch"
- assertNotVisible: "Schrauben"
- takeScreenshot: shots/10_shopping_listen
- back
