appId: dev.joe.joe_todo
name: Dashboard zeigt Heute-Karte, Ausklappmenue und Termine
---
- launchApp:
    clearState: true
- assertVisible: "(?s).*offene Aufgaben heute.*"
# "Heute abhaken" steht jetzt in der Heute-Karte, aufgeklappt.
- assertVisible: "(?s).*Heute abhaken.*"
- assertVisible: "(?s)Blumen gießen.*"
# Stufe 3 zaehlt nicht in den Zaehler, steht aber unter "Kann warten".
- assertVisible: "(?s).*Kann warten.*"
- assertVisible: "(?s).*Bücherregal sortieren.*"
- assertVisible: "Nächste Termine"
- assertVisible: "(?s).*Kaffee mit Anna.*"
- takeScreenshot: shots/01_dashboard
# Reiterreihenfolge: Aufgaben, Termine, Kalender, dann der Rest weiter unten.
- assertVisible: "Aufgaben"
- scrollUntilVisible:
    element:
      text: "Termine"
    direction: DOWN
- assertVisible: "Termine"
- scrollUntilVisible:
    element:
      text: "Kalender"
    direction: DOWN
- assertVisible: "Kalender"
