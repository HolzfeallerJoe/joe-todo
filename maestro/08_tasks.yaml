appId: dev.joe.joe_todo
name: Aufgaben-Reiter mit Prioritaeten
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Aufgaben"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Aufgaben"
    retryTapIfNoChange: false
- assertVisible: "Heute"
- assertVisible: "(?s).*Joe ausprobieren.*"
# Liegengebliebene Stufe 3 steht auch hier fuer sich, unter "Heute".
- assertVisible: "Hat Zeit"
- assertVisible: "(?s).*Bücherregal sortieren.*"
- assertVisible: "Wiederkehrend"
- takeScreenshot: shots/08_tasks
# Neue Aufgabe mit Stufe 1 anlegen. Hinweis: inputText kann nur ASCII.
- tapOn: "Neue Aufgabe"
- inputText: "Steuer machen"
- hideKeyboard
# Stufe und Beschriftung liegen in einem Knoten ("Stufe 1 Hoch"), deshalb
# der umschliessende Regex – ein blosses "Hoch" matcht nicht.
- tapOn: "(?s).*Stufe 1.*Hoch.*"
- tapOn: "Speichern"
- assertVisible: "(?s).*Steuer machen.*"
- takeScreenshot: shots/08_tasks_prioritaet
- back
