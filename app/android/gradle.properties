org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Gradles lokaler Build-Cache ist per Default aus – ohne ihn kompiliert jeder
# Lauf Kotlin, Desugaring und Dexing neu, auch wenn sich am Android-Teil
# nichts geaendert hat. In der CI liegt er unter caches/build-cache-1 und wird
# von gradle/actions/setup-gradle mitgenommen (siehe
# .github/workflows/joe-todo-apk.yml).
org.gradle.caching=true

# Das Projekt ist nicht nur :app – jedes Flutter-Plugin mit Android-Teil
# (flutter_local_notifications, device_calendar_plus, share_plus, …) wird ein
# eigenes Gradle-Modul. Die lassen sich nebenlaeufig bauen.
org.gradle.parallel=true
# Beide Schalter stehen so auch in der Projektvorlage von Flutter 3.47, und
# das ist kein Zufall: die neue DSL von AGP 9 vertraegt sich noch nicht mit
# dem Kotlin-Gradle-Plugin, das jedes Flutter-Plugin mit Android-Teil
# mitbringt ("The 'org.jetbrains.kotlin.android' plugin is not compatible
# with AGP's 9.0 new DSL"). Der Umstieg kommt, wenn die Plugin-Welt so weit
# ist – nicht frueher, sonst baut hier gar nichts mehr.
android.newDsl=false
android.builtInKotlin=false
