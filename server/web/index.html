<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6efdc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a241e" media="(prefers-color-scheme: dark)">
  <title>Geteilte Liste · Joe</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css">
  <script type="module" src="../assets/app.js"></script>
</head>
<body>
  <main class="sheet">
    <!-- Laden, Code, Fehler: eine Karte mit wechselndem Inhalt. -->
    <section id="gate" class="card gate">
      <p id="gate-text" class="gate-text">Liste wird geöffnet …</p>
      <form id="code-form" class="code-form" hidden>
        <label for="code-input">Diese Liste ist mit einem Code geschützt.</label>
        <input id="code-input" inputmode="numeric" autocomplete="one-time-code"
               maxlength="12" placeholder="6 Ziffern" required>
        <button type="submit" class="primary">Öffnen</button>
        <p id="code-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section id="list" class="card" hidden>
      <header class="list-head">
        <h1 id="list-name" class="list-name"></h1>
        <button id="rename" class="icon-button" type="button" aria-label="Liste umbenennen" title="Liste umbenennen">✎</button>
      </header>
      <form id="rename-form" class="rename-form" hidden>
        <input id="rename-input" maxlength="500" aria-label="Name der Liste">
        <button type="submit" class="primary">Speichern</button>
        <button type="button" id="rename-cancel">Abbrechen</button>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
      <ul id="items" class="items"></ul>
      <p id="empty" class="empty" hidden>Noch nichts auf der Liste.</p>
      <form id="add-form" class="add-form">
        <input id="add-input" maxlength="500" placeholder="Was fehlt?" aria-label="Neuer Eintrag" enterkeyhint="done" autocomplete="off">
        <button type="submit" class="primary" aria-label="Hinzufügen">+</button>
      </form>
    </section>

    <p class="footnote">
      Ende-zu-Ende verschlüsselt: Der Server sieht nur Kauderwelsch. Wer den
      Link hat, kann die Liste sehen und ändern. Diese Seite speichert nichts
      auf deinem Gerät.
    </p>
  </main>

  <dialog id="dialog" class="dialog">
    <form method="dialog">
      <p id="dialog-text" class="dialog-text"></p>
      <div class="dialog-buttons">
        <button id="dialog-second" value="second"></button>
        <button id="dialog-first" value="first" class="primary"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
